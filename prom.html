<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1:1 프라이빗 맞춤 바디 밸런싱 사전 문진</title>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        :root {
            --bg-main: #fdfbf7;
            --card-bg: #ffffff;
            --primary: #52796f;
            --primary-light: #e8f1ee;
            --accent: #84a98c;
            --rose-point: #b5838d;
            --text-main: #2f3e46;
            --text-sub: #6c757d;
            --border-light: #f0eae1;
            --border-active: #84a98c;
            --shadow-soft: 0 10px 30px rgba(132, 169, 140, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px 15px; 
            line-height: 1.6; 
        }
        
        .container { 
            max-width: 680px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            border-radius: 28px; 
            padding: 35px 24px; 
            box-shadow: var(--shadow-soft); 
            border: 1px solid var(--border-light);
        }
        
        .header { text-align: center; margin-bottom: 32px; border-bottom: 1.5px dashed var(--border-light); padding-bottom: 24px; }
        .header-badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; margin-bottom: 10px; }
        .header h1 { font-size: 23px; font-weight: 800; color: var(--text-main); margin: 0 0 8px 0; letter-spacing: -0.5px; }
        .header p { font-size: 14px; color: var(--text-sub); margin: 0; }

        .sec-title { 
            font-size: 16px; 
            font-weight: 800; 
            color: var(--primary); 
            background: var(--primary-light); 
            padding: 14px 20px; 
            border-radius: 16px; 
            margin: 36px 0 18px 0; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sec-title.psych { background: #fdf0f0; color: #a45a64; }
        .sec-title.mental { background: #f4f6f0; color: #4a6b5d; }

        .guide-box { font-size: 14px; color: var(--text-sub); background: #f9f6f0; padding: 14px 18px; border-radius: 14px; margin-bottom: 18px; border-left: 4px solid var(--accent); }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        @media (max-width: 500px) { .input-grid { grid-template-columns: 1fr; } }
        
        .full-width { grid-column: 1 / -1; }

        input[type="text"], input[type="tel"], input[type="number"], select {
            width: 100%; 
            padding: 16px 18px; 
            border-radius: 14px; 
            border: 1.5px solid var(--border-light); 
            font-size: 15px; 
            background: #fdfdfd; 
            color: var(--text-main); 
            appearance: none;
            transition: all 0.2s ease;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(132, 169, 140, 0.15); }

        .q-card { background: #fff; border: 1.5px solid var(--border-light); border-radius: 20px; padding: 20px; margin-bottom: 16px; transition: 0.2s; }
        .q-num { font-size: 13px; font-weight: 800; color: var(--rose-point); display: block; margin-bottom: 6px; }
        .q-text { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; word-break: keep-all; line-height: 1.5; }
        
        .opt-group { display: flex; flex-direction: column; gap: 9px; }
        .opt-label {
            border: 1.5px solid var(--border-light); 
            border-radius: 14px; 
            padding: 15px 18px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            background: #faf8f5; 
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        .opt-label input[type="radio"] { width: 20px; height: 20px; margin-right: 14px; accent-color: var(--primary); }
        .opt-label:has(input:checked) { 
            border-color: var(--border-active); 
            background: var(--primary-light); 
            color: var(--primary); 
            font-weight: 700;
            transform: translateY(-1px);
        }

        .submit-btn {
            width: 100%; 
            padding: 20px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 18px; 
            font-size: 18px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 35px; 
            box-shadow: 0 8px 20px rgba(82, 121, 111, 0.25);
            transition: all 0.2s ease;
        }
        .submit-btn:active { transform: scale(0.99); }
        .submit-btn:disabled { background: #d3d3d3; box-shadow: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="header-badge">🌿 100% Private Wellness Care</span>
        <h1>1:1 맞춤 바디 밸런싱 사전 문진</h1>
        <p>고급 세션 진행을 위한 전문 자가 컨디션 진단표입니다.</p>
    </div>

    <form id="wellnessForm">
        <div class="sec-title">👤 기본 인적 사항</div>
        <div class="input-grid">
            <div>
                <input type="text" id="pName" placeholder="성함 (예: 홍길동)" required>
            </div>
            <div>
                <input type="number" id="pAge" placeholder="나이 (예: 35)" min="1" max="120" required>
            </div>
            <div>
                <select id="pGender" required>
                    <option value="">성별</option>
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                </select>
            </div>
            <div>
                <select id="pJob" required>
                    <option value="">직업 / 주요 작업 형태</option>
                    <option value="사무직/컴퓨터사용">사무직 (장시간 컴퓨터 작업)</option>
                    <option value="육아/가사노동">육아 / 가사 노동 (반복 굴곡)</option>
                    <option value="현장/육체노동">현장 / 육체 노동 (중량물 취급)</option>
                    <option value="서비스/오래서있음">서비스직 (장시간 서 있기)</option>
                    <option value="학생/운전기사">운전 / 고정 자세 유지</option>
                    <option value="기타/일반">기타 / 일반</option>
                </select>
            </div>
            <div class="full-width">
                <input type="tel" id="pPhone" placeholder="연락처 (010-0000-0000)" required>
            </div>
            <div class="full-width">
                <input type="text" id="pAddress" placeholder="주소 검색 (터치하여 검색해 주세요)" readonly required style="cursor: pointer; background-color: #faf8f5;">
            </div>
        </div>

        <div class="sec-title">🎯 가장 불편한 신체 부위 정밀 진단</div>
        <div class="guide-box">현재 가장 통증이나 움직임 제한이 심한 부위 1곳을 선택해 주세요.</div>
        <select id="areaSelect" onchange="loadAreaQuestions()" required style="font-weight: 700; border-color: var(--accent);">
            <option value="">-- 불편하신 부위를 선택하세요 --</option>
            <option value="NDI">목 (뒷목, 목덜미, 두통)</option>
            <option value="SPADI">어깨 (통증 및 움직임 장애)</option>
            <option value="PRTEE">팔꿈치 (테니스/골프 엘보, 저림)</option>
            <option value="ODI">허리 (요통, 다리 저림)</option>
            <option value="HOOS">고관절 (사타구니, 엉덩이 관절)</option>
            <option value="KOOS">무릎 (통증, 붓기, 소리)</option>
            <option value="FAAM">발목 및 발바닥</option>
        </select>

        <div id="body-survey-area"></div>

        <div class="sec-title psych">🧠 움직임 공포 & 통증 반응 (TSK-11 / PCS)</div>
        <div id="psych-survey-area"></div>

        <div class="sec-title mental">🌿 마음 컨디션 (스트레스 · 불안 · 우울)</div>
        <div id="mental-survey-area"></div>

        <button type="submit" id="submitBtn" class="submit-btn">문진 작성 완료 및 전송하기</button>
    </form>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbxWQO-hVT-Nbf-xywFMx_Okv64T51zsITFILqwHuu4yWKyik30youiIs8MZaCyRewV2/exec';

function loadAreaQuestions() {
    const area = document.getElementById('areaSelect').value;
    const container = document.getElementById('body-survey-area');
    container.innerHTML = "";

    if (!area || !DATA_SURVEY[area]) return;

    const data = DATA_SURVEY[area];
    let html = `<div style="font-weight:800; color:var(--primary); margin: 20px 0 12px 0; font-size:16px;">[ ${data.title} ]</div>`;

    if (data.sections) {
        data.sections.forEach((sec, sIdx) => {
            html += `<div style="margin:18px 0 10px 0; font-weight:700; color:var(--text-main);">${sec.subTitle}</div>`;
            sec.qs.forEach((qText, qIdx) => {
                html += createQuestionCard(`body_${sIdx}_${qIdx}`, qIdx + 1, qText, sec.opts);
            });
        });
    } else {
        const questionsList = data.qs || data.questions;
        questionsList.forEach((qObj, idx) => {
            const qText = (typeof qObj === 'object') ? qObj.q : qObj;
            const opts = (typeof qObj === 'object') ? qObj.opts : data.opts;
            html += createQuestionCard(`body_${idx}`, idx + 1, qText, opts);
        });
    }

    container.innerHTML = html;
}

function loadPsychQuestions() {
    const container = document.getElementById('psych-survey-area');
    let html = `<div style="font-weight:800; color:#a45a64; margin: 15px 0 10px 0;">[ ${DATA_SURVEY.TSK.title} ]</div>`;
    DATA_SURVEY.TSK.qs.forEach((qText, idx) => {
        html += createQuestionCard(`tsk_${idx}`, idx + 1, qText, DATA_SURVEY.TSK.labels);
    });

    html += `<div style="font-weight:800; color:#a45a64; margin: 28px 0 10px 0;">[ ${DATA_SURVEY.PCS.title} ]</div>`;
    DATA_SURVEY.PCS.qs.forEach((qText, idx) => {
        html += createQuestionCard(`pcs_${idx}`, idx + 1, qText, DATA_SURVEY.PCS.labels);
    });

    container.innerHTML = html;
}

function loadMentalQuestions() {
    const container = document.getElementById('mental-survey-area');
    let html = "";

    DATA_SURVEY.MENTAL.forEach((section, sIdx) => {
        html += `<div style="font-weight:800; color:#4a6b5d; margin: 22px 0 10px 0;">※ ${section.category}</div>`;
        section.qs.forEach((qText, idx) => {
            html += createQuestionCard(`mental_${sIdx}_${idx}`, idx + 1, qText, section.labels);
        });
    });

    container.innerHTML = html;
}

function createQuestionCard(name, num, text, options) {
    let card = `<div class="q-card"><span class="q-num">Q${num}</span><div class="q-text">${text}</div><div class="opt-group">`;
    options.forEach((opt, idx) => {
        card += `<label class="opt-label"><input type="radio" name="${name}" value="${idx}" required><span>${opt}</span></label>`;
    });
    card += `</div></div>`;
    return card;
}

function initAddressSearch() {
    const addrInput = document.getElementById('pAddress');
    addrInput.addEventListener('click', function() {
        new daum.Postcode({
            oncomplete: function(data) {
                let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                if (data.buildingName !== '') { addr += ' (' + data.buildingName + ')'; }
                addrInput.value = addr;
                document.getElementById('areaSelect').focus();
            }
        }).open();
    });
}

document.getElementById('wellnessForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "데이터 전송 중...";

    let bodyScore = 0;
    document.querySelectorAll('#body-survey-area input[type="radio"]:checked').forEach(r => { bodyScore += parseInt(r.value); });

    let tskTotal = 0;
    document.querySelectorAll('input[name^="tsk_"]:checked').forEach(r => { tskTotal += (parseInt(r.value) + 1); });

    let pcsTotal = 0;
    document.querySelectorAll('input[name^="pcs_"]:checked').forEach(r => { pcsTotal += parseInt(r.value); });

    const jobElem = document.getElementById('pJob');
    const jobVal = jobElem ? jobElem.value : '기타/일반';

    const payload = {
        name: document.getElementById('pName').value,
        age: document.getElementById('pAge').value,
        job: jobVal,
        phone: document.getElementById('pPhone').value,
        gender: document.getElementById('pGender').value,
        address: document.getElementById('pAddress').value,
        area: document.getElementById('areaSelect').value,
        bodyScore: bodyScore,
        tsk: tskTotal,
        pcs: pcsTotal,
        at: new Date().toLocaleString('ko-KR')
    };

    fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(() => {
        alert(`[문진 제출 완료]\n\n${payload.name}님, 사전 문진이 완료되었습니다.\n현장 차팅 시스템으로 이동합니다.`);
        
        const targetSoapUrl = "soap_chart.html"; 
        
        const queryParams = `?pName=${encodeURIComponent(payload.name)}`
                          + `&pAge=${payload.age}`
                          + `&pJob=${encodeURIComponent(payload.job)}`
                          + `&area=${encodeURIComponent(payload.area)}`
                          + `&bodyScore=${payload.bodyScore}`
                          + `&tsk=${payload.tsk}`
                          + `&pcs=${payload.pcs}`;

        window.location.href = targetSoapUrl + queryParams;
    })
    .catch(err => {
        alert("전송 중 오류가 발생했습니다.");
        btn.disabled = false;
        btn.innerText = "문진 작성 완료 및 전송하기";
    });
});

document.addEventListener('DOMContentLoaded', () => {
    loadPsychQuestions();
    loadMentalQuestions();
    initAddressSearch();
});
